<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Unsaid - Thematic Audio Edition</title>
  
  <!-- 【Xプロフィール限定アクセス制限スクリプト】 -->
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const key = urlParams.get('key');
      const dev = urlParams.get('dev');
      const ref = document.referrer.toLowerCase();

      // ?dev=1 がある場合は開発者テストモードとしてパスする
      if (dev === '1') return;
// --- 外部キーボード入力の処理を追加 ---
window.addEventListener('keydown', (e) => {
    // ゲームがプレイ中で、アクティブな時だけ反応させる
    // (※ もし元のコードでこれらの変数が使われていない場合は、このif文は削除しても構いません)
    if (typeof isQuestionActive === 'undefined' || !isQuestionActive || 
        typeof gamePlayMode === 'undefined' || gamePlayMode !== 'typing') {
        return;
    }

    // Backspaceキーの処理
    if (e.key === 'Backspace') {
        e.preventDefault(); // 画面の戻る動作などを防ぐ
        if (typeof handleCharInput === 'function') {
            handleCharInput('DEL');
        }
    }
    // アルファベットA-Zの処理 (大文字小文字問わず)
    else if (/^[a-zA-Z]$/.test(e.key)) {
        e.preventDefault(); // 予期せぬ動作を防ぐ
        if (typeof handleCharInput === 'function') {
            handleCharInput(e.key.toLowerCase()); // 小文字に統一して送信
        }
    }
});

      // X (t.co, twitter.com, x.com) からのアクセスか判定
      const isFromX = ref.includes('t.co') || ref.includes('twitter.com') || ref.includes('x.com');
      // 鍵が my_profile と一致するか判定
      const hasValidKey = (key === 'my_profile');

      if (!isFromX || !hasValidKey) {
        document.documentElement.innerHTML = `
          <body style="background:#000; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; margin:0; font-family:sans-serif;">
            <div style="text-align:center; padding: 20px; border: 1px solid #ef4444; border-radius: 12px; background: rgba(220, 38, 38, 0.1);">
              <h1 style="color:#ef4444; font-size:32px; letter-spacing: 2px;">🔒 ACCESS DENIED</h1>
              <p style="color:#9ca3af; margin-top: 10px; font-size: 14px;">このアプリは公式X(Twitter)のプロフィールリンクからのみ起動できます。</p>
            </div>
          </body>
        `;
        throw new Error("Access Denied: Invalid Referrer or Key.");
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cBase1: 'var(--c-base1)',
            cBase2: 'var(--c-base2)',
            cPanel: 'var(--c-panel)',
            cPanelHover: 'var(--c-panel-hover)',
            cAccent1: 'var(--c-accent1)',
            cAccent2: 'var(--c-accent2)',
            cTextMain: 'var(--c-text-main)',
            cTextSub: 'var(--c-text-sub)',
            cBorder: 'var(--c-border)'
          },
          fontFamily: {
            serif: ['"Shippori Mincho"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
  <style>

      /* 🚢 1. Wooden Ship (デフォルト) */

    }
    [data-theme="tavern"] {
      /* 🍷 2. Sepia Tavern */
      --c-base1: #120b08; --c-base2: #1e130d;
      --c-panel: rgba(30, 19, 13, 0.95); --c-panel-hover: rgba(45, 29, 20, 0.95);
      --c-accent1: #d97706; --c-accent2: #f59e0b;
      --c-text-main: #fef3c7; --c-text-sub: #fbbf24; --c-border: rgba(217, 119, 6, 0.4);

      --c-accent1: #0ea5e9; --c-accent2: #38bdf8;
      --c-text-main: #f0f9ff; --c-text-sub: #7dd3fc; --c-border: rgba(14, 165, 233, 0.4);
    }
    [data-theme="forest"] {
      /* 🌲 4. Ancient Forest */
      --c-base1: #052e16; --c-base2: #14532d;
      --c-panel: rgba(20, 83, 45, 0.95); --c-panel-hover: rgba(22, 101, 52, 0.95);
      --c-accent1: #10b981; --c-accent2: #34d399;
      --c-text-main: #ecfdf5; --c-text-sub: #6ee7b7; --c-border: rgba(16, 185, 129, 0.4);

      --c-text-main: #faf5ff; --c-text-sub: #d8b4fe; --c-border: rgba(168, 85, 247, 0.4);
    }

    body {
      background-color: var(--c-base1); color: var(--c-text-main);
      touch-action: manipulation; user-select: none; -webkit-user-select: none;
      transition: background-color 0.5s ease;
    }
    
    .theme-panel {
      background: var(--c-panel); border: 1px solid var(--c-border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      transition: all 0.3s ease;
    }
    
    .theme-btn {
      background: rgba(0, 0, 0, 0.2); border: 1px solid var(--c-border); color: var(--c-text-main);
      transition: all 0.15s ease;
    }
    .theme-btn:hover { background: rgba(0, 0, 0, 0.4); }
    .theme-btn:active, .theme-btn.active { background: var(--c-accent1); color: var(--c-base1); font-weight: 800; }
    
    .shake { animation: shakeAnim 0.2s ease-in-out; }
    @keyframes shakeAnim {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-4px, 2px); }
      75% { transform: translate(4px, -2px); }
    }
  </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col justify-between overflow-hidden font-serif">

  <!-- Header -->
  <header class="w-full px-4 py-2.5 flex justify-between items-center bg-cBase2 border-b border-cBorder z-30 transition-colors duration-500">
    <div class="flex items-center space-x-2">
      <div class="w-2.5 h-2.5 rounded-full bg-cAccent1 animate-pulse"></div>
      <span class="font-black tracking-widest text-cAccent1 text-lg font-mono">UNSAID</span>
      <span id="themeTitleBadge" class="text-[9px] font-mono text-cAccent2 bg-cPanel px-1.5 py-0.5 rounded border border-cBorder hidden sm:inline-block">Wooden Ship</span>
    </div>

    <div id="gameHud" class="hidden flex items-center space-x-4">
      <div class="text-right">
        <div class="text-[9px] text-cAccent1 font-mono">PROGRESS</div>
        <div id="hudProgress" class="font-mono text-cAccent2 font-bold text-sm">1 / 10</div>
      </div>
      <div class="text-right">
        <div class="text-[9px] text-cAccent1 font-mono">SCORE</div>
        <div id="hudScore" class="font-mono text-cTextMain font-bold text-sm">0</div>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="openThemeModal()" class="p-2 rounded-lg theme-btn text-xs" title="テーマ変更">🎨</button>
      <button id="soundBtn" onclick="toggleSound()" class="p-2 rounded-lg theme-btn text-xs" title="音声ON/OFF">🔊</button>
      <button id="homeBtn" onclick="returnToMenu()" class="hidden p-2 rounded-lg theme-btn text-xs" title="メニューに戻る">🏠</button>
    </div>
  </header>

  <!-- THEME MODAL -->
  <div id="themeModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="theme-panel w-full max-w-sm rounded-xl p-5 space-y-4">
      <div class="flex justify-between items-center text-cAccent2 font-bold font-mono">
        <span>🎨 SELECT THEME</span>
        <button onclick="closeThemeModal()" class="text-xl px-2 py-1 text-cTextMain hover:text-rose-400">&times;</button>
      </div>
      <div class="grid grid-cols-1 gap-2 font-mono text-xs">
        <button onclick="applyTheme('wood', 'Wooden Ship')" class="theme-btn py-3 rounded-lg font-bold flex justify-between px-4"><span>🚢 Wooden Ship</span><span>♪ マリンバ</span></button>
        <button onclick="applyTheme('tavern', 'Sepia Tavern')" class="theme-btn py-3 rounded-lg font-bold flex justify-between px-4"><span>🍷 Sepia Tavern</span><span>♪ 和音</span></button>
        <button onclick="applyTheme('ocean', 'Deep Ocean')" class="theme-btn py-3 rounded-lg font-bold flex justify-between px-4"><span>🌊 Deep Ocean</span><span>♪ ウェーブ</span></button>
        <button onclick="applyTheme('forest', 'Ancient Forest')" class="theme-btn py-3 rounded-lg font-bold flex justify-between px-4"><span>🌲 Ancient Forest</span><span>♪ クリスタル</span></button>
        <button onclick="applyTheme('amethyst', 'Amethyst')" class="theme-btn py-3 rounded-lg font-bold flex justify-between px-4"><span>🔮 Amethyst</span><span>♪ ミスティック</span></button>
      </div>
    </div>
  </div>

  <!-- MENU SCREEN -->
  <main id="menuScreen" class="flex-1 flex flex-col justify-start items-center px-4 max-w-md mx-auto w-full space-y-3 overflow-y-auto py-4 z-20">
    <div class="text-center space-y-1">
      <h1 class="text-3xl font-black tracking-widest text-cAccent2">語根航海図</h1>
      <p class="text-[11px] text-cTextSub">230の語源で、未知の単語を読み解く</p>
    </div>

    <!-- Mode Selector -->
    <div class="w-full theme-panel rounded-xl p-1 flex border border-cBorder">
      <button id="modeAutoBtn" onclick="setPlayMode('auto')" class="flex-1 py-2 rounded-lg text-xs font-bold theme-btn active">▶️ 自動再生</button>
      <button id="modeChoiceBtn" onclick="setPlayMode('choice')" class="flex-1 py-2 rounded-lg text-xs font-bold theme-btn">⚡ 4択</button>
      <button id="modeTypingBtn" onclick="setPlayMode('typing')" class="flex-1 py-2 rounded-lg text-xs font-bold theme-btn">⌨️ スペル</button>
    </div>

      <div class="flex rounded-xl bg-black/40 p-1 border border-cBorder text-[11px]">

        <button id="tabLatin" onclick="switchCategory('latin')" class="flex-1 py-1.5 font-bold rounded-lg theme-btn">ラテン</button>

  <!-- PLAY SCREEN -->

    <div id="playArea" class="relative flex-1 w-full my-2 overflow-hidden border border-cBorder rounded-2xl bg-black/20">

        <div id="cardCategory" class="text-[10px] font-mono tracking-widest text-cAccent1 mb-1">STAGE</div>
        
        <!-- Root Display -->

          <span id="rootMeaning" class="text-sm font-bold text-cTextSub block mt-0.5">---</span>

          <div id="derivedMeaning" class="text-xs text-cTextSub">---</div>

        </div>
      </div>
    </div>

    <!-- Interactive Pad -->
    <div id="interactivePad" class="mb-2 w-full z-30">
      <div id="answersGrid" class="grid grid-cols-2 gap-2 w-full"></div>
      
      <div id="virtualKeyboard" class="hidden theme-panel rounded-xl p-2 space-y-1">
        <div class="flex justify-center space-x-1" id="kbRow1"></div>
        <div class="flex justify-center space-x-1" id="kbRow2"></div>
        <div class="flex justify-center space-x-1" id="kbRow3"></div>
      </div>

      <div id="autoControls" class="hidden flex justify-center space-x-3">
        <button onclick="pauseResumeAuto()" id="autoPauseBtn" class="px-5 py-2.5 rounded-xl theme-btn font-bold text-xs">⏸️ 一時停止</button>
        <button onclick="nextAutoStep()" class="px-5 py-2.5 rounded-xl theme-btn font-bold text-xs">次へ ➔</button>
      </div>
    </div>
  </main>

  <!-- RESULT SCREEN -->
  <main id="resultScreen" class="hidden flex-1 flex flex-col justify-center items-center px-4 max-w-md mx-auto w-full text-center space-y-4 z-20 my-auto">
    <div class="theme-panel w-full rounded-2xl p-6 space-y-4 max-h-[85vh] overflow-y-auto">
      <h2 class="text-2xl font-black text-cAccent2 font-mono">STAGE CLEAR</h2>
      
      <div class="grid grid-cols-2 gap-2 font-mono text-xs">
        <div class="bg-black/40 p-3 rounded-xl border border-cBorder">
          <div class="text-cAccent1 text-[10px]">SCORE</div>

        </div>
        <div class="bg-black/40 p-3 rounded-xl border border-cBorder">
          <div class="text-cAccent1 text-[10px]">ACCURACY</div>
          <div id="resAccuracy" class="text-lg font-bold text-white">100%</div>
        </div>
      </div>

      </div>

      <div class="flex space-x-2 pt-2">
        <button onclick="returnToMenu()" class="flex-1 py-3 rounded-xl theme-btn font-bold text-xs">MENU</button>
        <button onclick="replayCurrentStage()" class="flex-1 py-3 rounded-xl theme-btn font-bold text-xs">もう一度</button>
        <button id="nextStageBtn" onclick="goToNextStage()" class="flex-1 py-3 rounded-xl theme-btn font-bold text-xs active">NEXT ➔</button>
      </div>
    </div>
  </main>

            osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            osc.start(); osc.stop(this.ctx.currentTime + 0.2);
          }
          osc.connect(gain); gain.connect(this.ctx.destination);
        } catch(e) {}
      }
      speak(text) {
        if (!this.enabled || !this.synth) return;
        this.synth.cancel();
        const cleanText = text.replace(/[・\-_/]/g, '').trim();
        const u = new SpeechSynthesisUtterance(cleanText);
        u.lang = 'en-US'; u.rate = 0.85;
        this.synth.speak(u);
      }
      startBGM(theme) {
        this.currentTheme = theme;
        if (!this.enabled) return;
        this.init();
        this.stopBGM();
        const configs = {
          wood: { chords: [[261.6, 329.6, 392.0], [220.0, 261.6, 329.6]], type: 'triangle', filter: 1000, atk: 0.05, rel: 1.5, interval: 3000 },
          tavern: { chords: [[196.0, 246.9, 293.6], [261.6, 329.6, 392.0]], type: 'sine', filter: 800, atk: 0.5, rel: 2.0, interval: 4000 },
          ocean: { chords: [[130.8, 196.0, 261.6], [146.8, 220.0, 293.6]], type: 'sine', filter: 400, atk: 2.0, rel: 4.0, interval: 6000 },
          forest: { chords: [[329.6, 440.0, 523.2], [349.2, 440.0, 523.2]], type: 'sine', filter: 1500, atk: 1.0, rel: 3.0, interval: 4500 },
          amethyst: { chords: [[246.9, 293.6, 369.9], [277.1, 329.6, 415.3]], type: 'triangle', filter: 1200, atk: 0.8, rel: 2.5, interval: 3500 }
        };
        const cfg = configs[theme] || configs['wood'];
        let step = 0;
        const playChord = () => {
          if (!this.enabled) return;
          const chord = cfg.chords[step % cfg.chords.length];
          step++;
          chord.forEach(freq => {
            try {
              const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); const filter = this.ctx.createBiquadFilter();
              osc.type = cfg.type; osc.frequency.value = freq; filter.type = 'lowpass'; filter.frequency.value = cfg.filter;
              gain.gain.setValueAtTime(0.001, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime + cfg.atk);
              gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + cfg.atk + cfg.rel);
              osc.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
              osc.start(); osc.stop(this.ctx.currentTime + cfg.atk + cfg.rel + 0.1);
            } catch(e) {}
          });
        };
        playChord(); this.bgmTimer = setInterval(playChord, cfg.interval);
      }
      stopBGM() {
        if (this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; }
      }
    }
    const sound = new SoundEngine();
    document.addEventListener('click', (e) => {
      if (e.target.closest('button') && !e.target.closest('#soundBtn')) sound.playHit('click');
    });
    document.addEventListener('pointerdown', () => { sound.init(); }, { once: true });

    function toggleSound() {
      sound.enabled = !sound.enabled;
      document.getElementById('soundBtn').textContent = sound.enabled ? '🔊' : '🔈';
      if (!sound.enabled) { if (sound.synth) sound.synth.cancel(); sound.stopBGM(); } 
      else { sound.startBGM(sound.currentTheme); }
    }

    // --- Theme Control ---
    function applyTheme(name, title) {
      document.documentElement.setAttribute('data-theme', name);
      localStorage.setItem('unsaid_theme', name);
      document.getElementById('themeTitleBadge').textContent = title;
      if (sound.enabled) sound.startBGM(name);
      closeThemeModal();
    }
    function openThemeModal() { document.getElementById('themeModal').classList.remove('hidden'); }
    function closeThemeModal() { document.getElementById('themeModal').classList.add('hidden'); }

    // --- Init ---
    window.onload = () => {
      applyTheme(localStorage.getItem('unsaid_theme') || 'wood', 'Wooden Ship');
      switchCategory('affix');
    };

    function setPlayMode(mode) {
      playMode = mode;
      ['Auto', 'Choice', 'Typing'].forEach(m => {
        const b = document.getElementById(`mode${m}Btn`);
        if (m.toLowerCase() === mode) b.classList.add('active');
        else b.classList.remove('active');
      });
    }

    function switchCategory(cat) {
      currentCategory = cat;
      ['Affix', 'Latin', 'Germanic', 'Greek'].forEach(c => {
        const b = document.getElementById(`tab${c}`);
        if (c.toLowerCase() === cat) b.classList.add('active');
        else b.classList.remove('active');
      });
      renderStages();
    }

    function renderStages() {
      const list = document.getElementById('stageList');
      list.innerHTML = '';
      const stages = stageDB[currentCategory] || [];
      stages.forEach((stg, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full theme-panel hover:opacity-80 p-3 rounded-xl flex justify-between items-center text-left transition mb-2";
        btn.innerHTML = `<div><div class="font-bold text-xs text-cAccent2">${stg.name}</div><div class="text-[10px] text-cTextSub">収録: ${stg.items.length} 語根</div></div><span class="text-xs text-cAccent1 font-bold">出航 ➔</span>`;
        btn.onclick = () => launchStage(idx);
        list.appendChild(btn);
      });
    }

    // --- Game Logic ---
    function launchStage(idx) {
      currentStageIdx = idx;
      stageItems = stageDB[currentCategory][idx].items;
      itemIndex = 0; score = 0; correctCount = 0; totalAttempts = 0; mistakes = [];

      document.getElementById('menuScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('gameHud').classList.remove('hidden');
      document.getElementById('homeBtn').classList.remove('hidden');

      const ansGrid = document.getElementById('answersGrid');
      const vKb = document.getElementById('virtualKeyboard');
      const tArea = document.getElementById('typingArea');
      const aCtrl = document.getElementById('autoControls');

      if (playMode === 'auto') {
        ansGrid.classList.add('hidden'); vKb.classList.add('hidden'); tArea.classList.add('hidden'); aCtrl.classList.remove('hidden');
      } else if (playMode === 'choice') {
        aCtrl.classList.add('hidden'); vKb.classList.add('hidden'); tArea.classList.add('hidden'); ansGrid.classList.remove('hidden');
      } else {
        aCtrl.classList.add('hidden'); ansGrid.classList.add('hidden'); tArea.classList.remove('hidden'); vKb.classList.remove('hidden');
        initVirtualKeyboard();
      }
      startNextQuestion();
    }

    function returnToMenu() {
      clearTimeout(autoStepTimer); cancelAnimationFrame(animFrame);
      isQuestionActive = false; if (sound.synth) sound.synth.cancel();
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('gameHud').classList.add('hidden');
      document.getElementById('homeBtn').classList.add('hidden');
      document.getElementById('menuScreen').classList.remove('hidden');
    }

    function startNextQuestion() {
      clearTimeout(autoStepTimer); cancelAnimationFrame(animFrame);
      if (itemIndex >= stageItems.length) { finishStage(); return; }

      currentItem = stageItems[itemIndex];
      exIndex = 0;
      document.getElementById('hudProgress').textContent = `${itemIndex + 1} / ${stageItems.length}`;
      document.getElementById('hudScore').textContent = score;

      posY = 0; document.getElementById('fallingCard').style.top = '0px';
      eliminatedDistractors = 0; distractorBtns = []; typedStr = "";

      document.getElementById('cardCategory').textContent = stageDB[currentCategory][currentStageIdx].name;
      
      const rt = document.getElementById('rootText');
      const rm = document.getElementById('rootMeaning');

      if (playMode === 'choice') {
        rt.textContent = currentItem.root; rm.textContent = '???';
        setupChoiceGrid(); isQuestionActive = true; updatePhysics();
      } else if (playMode === 'typing') {
        rt.textContent = '???'; rm.textContent = currentItem.meaning;
        updateTypedBuffer(); isQuestionActive = true; updatePhysics();
      } else {
        rt.textContent = currentItem.root; rm.textContent = currentItem.meaning;
        isQuestionActive = false; runAutoPlayCycle();
      }
      presentExample(0);
    }

    function presentExample(idx) {
      if (!currentItem.examples[idx]) return;
      const ex = currentItem.examples[idx];
      const rootClean = currentItem.root.replace(/[-_]/g, '').toLowerCase();
      
      document.getElementById('derivedWord').innerHTML = ex.word.split('・').map(p => {
        return (p.toLowerCase() === rootClean || rootClean.startsWith(p.toLowerCase())) 
          ? `<span class="text-cAccent2 underline decoration-cAccent1/50">${p}</span>` 
          : `<span class="text-white">${p}</span>`;
      }).join('<span class="text-cAccent1/30 mx-0.5">•</span>');
      
      document.getElementById('derivedMeaning').textContent = ex.meaning;
      sound.speak(ex.word);
    }

    function updatePhysics() {
      if (!isQuestionActive || playMode === 'auto') return;
      const maxLimit = document.getElementById('playArea').clientHeight - document.getElementById('fallingCard').clientHeight - 8;
      posY += fallSpeed;
      document.getElementById('fallingCard').style.top = `${posY}px`;

      const progress = posY / maxLimit;
      if (playMode === 'choice') {
        if (progress > 0.35 && eliminatedDistractors === 0) { eliminateOneDistractor(0); presentExample(1); }
        if (progress > 0.70 && eliminatedDistractors === 1) { eliminateOneDistractor(1); presentExample(2); }
      }
      if (posY >= maxLimit) { handleTimeout(); return; }
      animFrame = requestAnimationFrame(updatePhysics);
    }

    function setupChoiceGrid() {
      const grid = document.getElementById('answersGrid'); grid.innerHTML = '';
      const distractors = stageItems.filter(it => it.root !== currentItem.root).sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [currentItem, ...distractors].sort(() => Math.random() - 0.5);

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "theme-panel p-3 rounded-xl text-sm font-bold text-cTextMain hover:border-cAccent2 active:scale-95 transition min-h-[3.5rem] flex items-center justify-center text-center";
        btn.textContent = opt.meaning;
        btn.onclick = () => evaluateAnswer(opt.root === currentItem.root);
        if (opt.root !== currentItem.root) distractorBtns.push(btn);
        grid.appendChild(btn);
      });
      distractorBtns.sort(() => Math.random() - 0.5);
    }

    function eliminateOneDistractor(idx) {
      if (distractorBtns[idx]) {
        distractorBtns[idx].classList.add('opacity-0', 'pointer-events-none');
        eliminatedDistractors++;
      }
    }

    function evaluateAnswer(isCorrect) {
      if (!isQuestionActive) return;
      isQuestionActive = false; totalAttempts++;
      if (isCorrect) {
        sound.playHit('correct'); correctCount++; score += Math.max(50, Math.round(200 - posY * 0.5));
      } else {
        sound.playHit('wrong');
        if (!mistakes.some(m => m.root === currentItem.root)) mistakes.push(currentItem);
        document.body.classList.add('shake'); setTimeout(() => document.body.classList.remove('shake'), 200);
      }
      itemIndex++; startNextQuestion();
    }

    function handleTimeout() {
      isQuestionActive = false; totalAttempts++; sound.playHit('wrong');
      if (!mistakes.some(m => m.root === currentItem.root)) mistakes.push(currentItem);
      document.body.classList.add('shake'); setTimeout(() => document.body.classList.remove('shake'), 200);
      itemIndex++; startNextQuestion();
    }

    function initVirtualKeyboard() {
      const rows = [['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m','DEL']];
      [1, 2, 3].forEach(rNum => {
        const row = document.getElementById(`kbRow${rNum}`); row.innerHTML = '';
        rows[rNum - 1].forEach(char => {
          const b = document.createElement('button');
          b.className = "px-2 py-2 bg-black/30 border border-cBorder rounded text-xs font-mono font-bold text-cAccent2 active:bg-cAccent1 active:text-cBase1 min-w-[2rem]";
          b.textContent = char.toUpperCase();
          b.onclick = () => handleInputChar(char);
          row.appendChild(b);
        });
      });
    }

    function handleInputChar(char) {
      if (!isQuestionActive || playMode !== 'typing') return;
      const targetClean = currentItem.root.replace(/[-_ ]/g, '').toLowerCase();
      if (char === 'DEL') typedStr = typedStr.slice(0, -1);
      else typedStr += char.toLowerCase();
      updateTypedBuffer();

      if (typedStr === targetClean) evaluateAnswer(true);
      else if (!targetClean.startsWith(typedStr)) {
        sound.playHit('wrong');
        if (!mistakes.some(m => m.root === currentItem.root)) mistakes.push(currentItem);
        document.body.classList.add('shake'); setTimeout(() => document.body.classList.remove('shake'), 200);
        typedStr = ""; updateTypedBuffer();
      }
    }

    function updateTypedBuffer() {
      const targetClean = currentItem.root.replace(/[-_ ]/g, '').toLowerCase();
      const remain = Math.max(0, targetClean.length - typedStr.length);
      document.getElementById('typedBuffer').textContent = typedStr + "_".repeat(remain);
    }

    function runAutoPlayCycle() {
      if (isAutoPaused || !document.getElementById('gameScreen').classList.contains('hidden') === false) return;
      const nextSubStep = () => {
        if (isAutoPaused || playMode !== 'auto') return;
        exIndex++;
        if (exIndex < currentItem.examples.length) {
          presentExample(exIndex); autoStepTimer = setTimeout(nextSubStep, 3500);
        } else {
          itemIndex++; startNextQuestion();
        }
      };
      autoStepTimer = setTimeout(nextSubStep, 3500);
    }

    function pauseResumeAuto() {
      isAutoPaused = !isAutoPaused;
      const btn = document.getElementById('autoPauseBtn');
      if (isAutoPaused) { clearTimeout(autoStepTimer); btn.textContent = '▶️ 再開'; } 
      else { btn.textContent = '⏸️ 一時停止'; runAutoPlayCycle(); }
    }
    function nextAutoStep() { clearTimeout(autoStepTimer); itemIndex++; startNextQuestion(); }

    function finishStage() {
      clearTimeout(autoStepTimer); cancelAnimationFrame(animFrame);
      isQuestionActive = false; if (sound.synth) sound.synth.cancel();

      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');

      const acc = totalAttempts > 0 ? Math.round((correctCount / totalAttempts) * 100) : 100;
      document.getElementById('resScore').textContent = score;
      document.getElementById('resAccuracy').textContent = `${acc}%`;

      const mCont = document.getElementById('mistakesContainer');
      const mList = document.getElementById('mistakesList'); mList.innerHTML = '';

      if (mistakes.length > 0) {
        mCont.classList.remove('hidden');
        mistakes.forEach(m => {
          const row = document.createElement('div');
          row.className = 'flex justify-between items-center border-b border-cBorder/30 pb-1';
          const speakTextStr = m.examples[0].word.replace(/'/g, "\\'");
          row.innerHTML = `<div class="flex items-center space-x-2"><button onclick="sound.speak('${speakTextStr}')" class="text-cAccent2 hover:text-white">🔊</button><div><span class="font-bold text-cTextMain font-mono">${m.root}</span><span class="text-[9px] text-cAccent1 block font-mono">例: ${m.examples[0].word}</span></div></div><span class="text-cAccent2 font-bold text-[10px]">${m.meaning}</span>`;
          mList.appendChild(row);
        });
      } else { mCont.classList.add('hidden'); }

      const nextBtn = document.getElementById('nextStageBtn');
      if (currentStageIdx + 1 < stageDB[currentCategory].length) nextBtn.classList.remove('hidden');
      else nextBtn.classList.add('hidden');
    }

    function replayCurrentStage() { launchStage(currentStageIdx); }
    function goToNextStage() { launchStage(currentStageIdx + 1); }
  </script>
